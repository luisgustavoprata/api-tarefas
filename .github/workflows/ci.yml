name: CI

on:
  push:
  pull_request:

jobs:
  lint-e-testes:
    name: Lint e testes (SQLite, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  postgres:
    name: Testes com PostgreSQL 16
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tarefas
          POSTGRES_PASSWORD: tarefas
          POSTGRES_DB: tarefas_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tarefas" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://tarefas:tarefas@localhost:5432/tarefas_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest

  docker:
    name: Build da imagem Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t api-tarefas .
      - name: Sobe o container e confere o /health
        run: |
          docker run -d --name api -p 8000:8000 -e SEED_DEMO=true api-tarefas
          for i in $(seq 1 30); do curl -fs localhost:8000/health && exit 0; sleep 1; done
          docker logs api; exit 1
