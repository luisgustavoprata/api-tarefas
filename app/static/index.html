<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tarefas</title>
  <meta name="description" content="Anote tarefas do jeito que você fala: prazo, prioridade e etiquetas entram sozinhos.">
  <meta name="theme-color" content="#3346d3">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <script>
    /* Aplica o tema antes de desenhar a página, para não piscar. */
    (function () {
      var saved = null;
      try { saved = localStorage.getItem("tarefas.theme"); } catch (e) {}
      var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div id="root"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <noscript>Esta página precisa de JavaScript. A API continua disponível em /docs.</noscript>
  <script src="/static/app.js" defer></script>
</body>
</html>
