[project]
name = "api-tarefas"
version = "1.5.0"
description = "API REST de tarefas com FastAPI, SQLAlchemy 2 e JWT."
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# Depends()/Query() nos parâmetros é o padrão do FastAPI.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
